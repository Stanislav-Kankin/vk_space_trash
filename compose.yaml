services:
  game-frontend:
    build:
      context: ./frontend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-local}
    image: cosmic-scavenger-frontend:${BUILD_VERSION:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GAME_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
